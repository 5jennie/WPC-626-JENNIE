<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>01-2.배경 크기 설정</title>
    <style>
      /* 타이틀 */
      .tit {
        text-align: center;
        font-size: 40px;
      }

      /* 큰제목 */
      .t1 {
        font-size: 50px;
      }

      /* 배경박스 부모 */
      .wrap {
        padding: 20px;
      }

      /* 배경박스 공통 */
      .wrap > div {
        /* 공통배경 세팅 */
        background-image: url(./imgs/bg_mainvisual.jpg);
        /* 배경 반복 여부 */
        background-repeat: no-repeat;
        /* 배경 위치 */
        background-position: center;
        /* center 값을 하나만 주면 x축 중앙을 세팅함 */
        /* 단 세로값은 center가 기본값이기 때문에 자동 중앙 정렬 */

        /* 가로 크기 */
        width: 80%;
        /* 세로 크기 */
        height: 400px;
        /* 테두리 */
        border: 3px dashed hotpink;
        /* 블록요소 가로 중앙정렬 */
        margin: 0 auto;
        /* 하단마진 */
        margin-bottom: 40px;
        /* 둥근 모서리 */
        border-radius: 20px;
      }

      /* 가상 클래스로 자식 요소 선택하기
      요소:nth-of-type(순번)
      여러종류가 섞여있는 자식요소 중
      순번으로 선택하는 가상클래스

      한가지 종류의 자식요소일때는
      요소:nth-child(순번) */

      /* 1. div 박스 */
      /* 가로는 100%로 꽉 채우고, 세로는 비율 유지 */
      .wrap > div:nth-of-type(1) {
        background-size: 100% auto;
      }
      /* 2. div 박스 */
      /* 세로는 100%로 꽉 채우고, 가로는 비율 유지 */
      .wrap > div:nth-of-type(2) {
        background-size: auto 100%;
      }
      /* 3. div 박스 */
      /* 가로 세로 100%로 도형에 맞춤
      디자이너들이 제일 싫어하는 코딩 */
      .wrap > div:nth-of-type(3) {
        background-size: 100% 100%;
      }
      /* 4. div 박스 */
      /* 박스속 이미지가 비율을 유지하며 전체 다 보인다 */
      .wrap > div:nth-of-type(4) {
        background-size: contain;
      }
      /* 5. div 박스 */
      /* 정말 많이 사용하는 수식 */
      /* 박스속의 빈공간 없이
      이미지 사이즈 비율을 유지하며 키운다 */
      .wrap > div:nth-of-type(5) {
        background-size: cover;
      }

    </style>
  </head>
  <body>
    <h1 class="tit t1">배경연습 - background-size</h1>
    <div class="wrap">
      <h2 class="tit">background-size : 100% auto</h2>
      <div></div>
      <h2 class="tit">background-size : auto 100%</h2>
      <div></div>
      <h2 class="tit">background-size : 100% 100%</h2>
      <div></div>
      <h2 class="tit">background-size : contain</h2>
      <div></div>
      <h2 class="tit">background-size : cover</h2>
      <div></div>
    </div>
  </body>
</html>
