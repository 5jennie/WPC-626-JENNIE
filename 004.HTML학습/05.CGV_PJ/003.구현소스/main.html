<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CGV에 오신것을 환영합니다!</title>
    <!-- 폰트어썸 아이콘 CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />

    <!-- 메인 CSS -->
    <link rel="stylesheet" href="./css/main.css" />
    <!-- 미디어쿼리 CSS : 
     덮어쓸 수 있게 메인 CSS 아래쪽에 위치해야함! -->
    <link rel="stylesheet" href="./css/media.css" />

    <!-- 추가 기능 JS 외부파일
     defer속성은 html태그 로딩후 실행함! -->
    <script src="./js/main.js" defer></script>
  </head>
  <body>
    <!-- 1. 상단영역 -->
    <div id="top-area">
      <header class="top-area inbox"></header>
    </div>
    <!-- 2. 메인영역 -->
    <div id="main-area">
      <main class="main-area inbox">
        <!-- 스크린박스 -->
        <div class="screen">
          <iframe
            src="https://www.youtube.com/embed/zN8K_uE1LYg?si=GxOLhEcJEmHRITj1
            &autoplay=1&mute=1&loop=1&playlist=8p1VNDiI4WM"
            allow="autoplay"
          ></iframe>
        </div>
      </main>
    </div>

    <!-- 3. 하단영역 -->
    <div id="bottom-area">
      <footer class="bottom-area inbox"></footer>
    </div>
  </body>
</html>
